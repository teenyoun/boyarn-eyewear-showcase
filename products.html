<style>
:root{--bg:#f8f8f6;--card:#fff;--text:#1a1a1a;--muted:#6e6e6e;--gold:#a6803b;--border:#e8e6e0;--radius:3px}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Inter','Segoe UI',system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
::selection{background:var(--gold);color:#fff}

/* ── NAV ── */
nav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 48px;height:68px}
nav a{text-decoration:none}
nav .logo img{height:30px;width:auto;display:block}
nav .back{color:var(--muted);font-size:.72rem;font-weight:500;text-transform:uppercase;letter-spacing:.15em;transition:color .3s}
nav .back:hover{color:var(--gold)}

/* ── HEADER ── */
.header{text-align:center;padding:48px 24px 40px}
.header h1{font-size:2rem;font-weight:300;color:var(--text);letter-spacing:.04em}
.header .count{font-size:.8rem;color:var(--muted);margin-top:8px}

/* ── TOOLBAR ── */
.toolbar{max-width:1400px;margin:0 auto 32px;padding:0 48px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.toolbar .search{flex:1;max-width:360px;position:relative}
.toolbar .search input{width:100%;padding:10px 16px 10px 40px;border:1px solid var(--border);border-radius:var(--radius);font-size:.8rem;color:var(--text);background:#fff;outline:none;transition:border-color .3s}
.toolbar .search input:focus{border-color:var(--gold)}
.toolbar .search .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.85rem}
.toolbar .sort-btn{padding:10px 20px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;color:var(--text);font-size:.75rem;cursor:pointer;transition:all .3s;white-space:nowrap}
.toolbar .sort-btn:hover,.toolbar .sort-btn.active{border-color:var(--gold);color:var(--gold)}

/* ── GRID ── */
.products-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;max-width:1400px;margin:0 auto;padding:0 48px 80px}
.product-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:box-shadow .3s,transform .3s}
.product-card:hover{box-shadow:0 6px 20px rgba(0,0,0,.06);transform:translateY(-2px)}
.product-card .img-wrap{aspect-ratio:1;overflow:hidden;background:#fafaf8}
.product-card .img-wrap img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.product-card:hover .img-wrap img{transform:scale(1.04)}
.product-card .info{padding:14px 16px 18px}
.product-card .info h3{font-size:.78rem;font-weight:500;color:var(--text);line-height:1.35;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.product-card .info .price{font-size:.88rem;font-weight:600;color:var(--gold)}

/* ── PAGINATION ── */
.pagination{display:flex;justify-content:center;align-items:center;gap:8px;padding:0 48px 64px}
.pagination button{padding:8px 16px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;color:var(--text);font-size:.75rem;cursor:pointer;transition:all .3s}
.pagination button:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.pagination button.active{background:var(--gold);color:#fff;border-color:var(--gold)}
.pagination button:disabled{opacity:.35;cursor:default}
.pagination .info{font-size:.72rem;color:var(--muted)}

/* ── EMPTY ── */
.empty{text-align:center;padding:80px 24px}
.empty p{color:var(--muted);font-size:.9rem}

/* ── FOOTER ── */
footer{border-top:1px solid var(--border);padding:40px;text-align:center;background:#fff}
footer img{height:24px;width:auto;display:block;margin:0 auto 8px}
footer .copy{font-size:.62rem;color:var(--muted);letter-spacing:.1em}

@media(max-width:1200px){.products-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:768px){
  nav,.toolbar{padding-left:20px;padding-right:20px}
  .products-grid{grid-template-columns:repeat(2,1fr);gap:10px;padding:0 20px 60px}
  .header h1{font-size:1.4rem}
}
@media(max-width:480px){.products-grid{grid-template-columns:1fr;max-width:340px;margin:0 auto}}

<script>
let allProducts=[];
let filteredProducts=[];
let currentPage=1;
const PER_PAGE=24;
let currentSort='default';

// Extract numeric min price from price string for sorting
function getMinPrice(p){
  const m=p.price.match(/[\d.]+/g);
  if(!m)return Infinity;
  return parseFloat(m[0]);
}

function sortBy(mode){
  currentSort=mode;
  document.querySelectorAll('.sort-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById(mode==='default'?'sortDefault':mode==='price-asc'?'sortPriceLo':'sortPriceHi').classList.add('active');
  if(mode==='price-asc'){
    filteredProducts.sort((a,b)=>getMinPrice(a)-getMinPrice(b));
  }else if(mode==='price-desc'){
    filteredProducts.sort((a,b)=>getMinPrice(b)-getMinPrice(a));
  }else{
    filteredProducts=[...allProducts];
  }
  currentPage=1;
  renderPage();
}

function filterProducts(){
  const q=document.getElementById('searchInput').value.toLowerCase().trim();
  if(!q){
    filteredProducts=currentSort==='price-asc'?[...allProducts].sort((a,b)=>getMinPrice(a)-getMinPrice(b)):
                    currentSort==='price-desc'?[...allProducts].sort((a,b)=>getMinPrice(b)-getMinPrice(a)):
                    [...allProducts];
  }else{
    filteredProducts=allProducts.filter(p=>p.name.toLowerCase().includes(q));
    if(currentSort==='price-asc')filteredProducts.sort((a,b)=>getMinPrice(a)-getMinPrice(b));
    if(currentSort==='price-desc')filteredProducts.sort((a,b)=>getMinPrice(b)-getMinPrice(a));
  }
  currentPage=1;
  renderPage();
}

function renderPage(){
  const total=filteredProducts.length;
  const pages=Math.ceil(total/PER_PAGE);
  if(currentPage>pages)currentPage=Math.max(1,pages);

  const start=(currentPage-1)*PER_PAGE;
  const slice=filteredProducts.slice(start,start+PER_PAGE);

  document.getElementById('totalCount').textContent=total+' products';

  const grid=document.getElementById('productGrid');
  if(slice.length===0){
    grid.innerHTML='<div class="empty" style="grid-column:1/-1"><p>No products found matching your search.</p></div>';
    document.getElementById('pagination').innerHTML='';
    return;
  }

  grid.innerHTML=slice.map(p=>`
    <div class="product-card">
      <div class="img-wrap">
        <img src="${p.img}" alt="${p.name}" loading="lazy">
      </div>
      <div class="info">
        <h3>${p.name}</h3>
        <div class="price">${p.price}</div>
      </div>
    </div>
  `).join('');

  // Pagination
  const pag=document.getElementById('pagination');
  if(pages<=1){pag.innerHTML='';return;}
  let html='<button '+(currentPage===1?'disabled':'')+' onclick="goTo('+(currentPage-1)+')">Prev</button>';
  html+='<span class="info">Page '+currentPage+' / '+pages+'</span>';
  html+='<button '+(currentPage===pages?'disabled':'')+' onclick="goTo('+(currentPage+1)+')">Next</button>';
  pag.innerHTML=html;

  window.scrollTo({top:200,behavior:'smooth'});
}

function goTo(page){
  currentPage=page;
  renderPage();
  window.scrollTo({top:200,behavior:'smooth'});
}
